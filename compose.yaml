x-healthcheck: &healthcheck
  interval: 1m
  retries: 2
  start_period: 1m
  timeout: 30s
x-placement: &placement
  placement:
    constraints:
      - node.role == manager
networks:
  outsideworx:
    external: true
services:
  home-assistant:
    deploy:
      <<: *placement
      labels:
        - traefik.enable=true
        - traefik.http.routers.home-assistant.entrypoints=websecure
        - traefik.http.routers.home-assistant.rule=Host(`home-assistant.outsideworx.net`)
        - traefik.http.routers.home-assistant.tls.certresolver=letsencrypt
        - traefik.http.services.home-assistant.loadbalancer.server.port=8123
    environment:
      TZ: Europe/Budapest
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123"]
    image: ghcr.io/home-assistant/home-assistant:2026.8.3
    networks:
      - outsideworx
    volumes:
      - home-assistant:/config
volumes:
  home-assistant:
